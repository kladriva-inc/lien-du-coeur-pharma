# Déploiement continu — modèle du parc (kladriva-context/REGLES.md §3) :
# runners GitHub, image sur GHCR, ArgoCD tire. Aucun kubeconfig ici.
#
#   push sur main → image ghcr.io/kladriva-inc/lien-du-coeur-pharma:<sha8>
#                 → bump k8s/kustomization.yaml (commit [skip ci])
#                 → Application ArgoCD lien-du-coeur-pharma (kladriva-inc/gitops, envs/prod/) déploie
#                 → preuve : https://lienducoeurpharma.com/api/version renvoie <sha8>
# Runbook : docs/DEPLOIEMENT.md
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'k8s/kustomization.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kladriva-inc/lien-du-coeur-pharma
  URL: https://lienducoeurpharma.com
  VPS_IP: 161.97.186.244

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:main
          build-args: |
            GIT_SHA=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Écrit le tag dans k8s/kustomization.yaml et pousse un commit [skip ci] :
  # c'est CE commit qu'ArgoCD déploie.
  release-manifest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Bump image tag
        run: |
          cd k8s
          kustomize edit set image "lien-du-coeur-pharma=$IMAGE:$TAG"
          git config user.email "ci@kladriva.com"
          git config user.name "lien-du-coeur-pharma CI"
          git add kustomization.yaml
          git diff --cached --quiet && { echo "Tag déjà à jour"; exit 0; }
          git commit -m "chore(deploy): image ${TAG} [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

  # Preuve en ligne (REGLES §3). Tant que le DNS du domaine ne pointe pas sur le VPS
  # (avant la bascule), l'étape avertit au lieu d'échouer ; ensuite elle est bloquante.
  verify:
    runs-on: ubuntu-latest
    needs: [build, release-manifest]
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Attendre la nouvelle version en ligne
        run: |
          ip=$(dig +short @8.8.8.8 lienducoeurpharma.com | tail -1)
          if [ "$ip" != "$VPS_IP" ]; then
            echo "::warning::lienducoeurpharma.com résout vers '$ip', pas $VPS_IP : vérification en ligne sautée (avant bascule DNS)"
            exit 0
          fi
          for i in $(seq 1 60); do
            sha=$(curl -s "$URL/api/version" | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p')
            if [ "$sha" = "$TAG" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
              [ "$code" = 200 ] && { echo "En ligne : $URL @ $TAG"; exit 0; }
            fi
            sleep 10
          done
          echo "::error::$URL ne sert pas $TAG après 10 min (sert : '${sha:-rien}')"
          exit 1
