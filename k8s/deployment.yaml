# Messages du formulaire : PVC (messages.jsonl), écrit AVANT l'envoi du courriel.
# Lecture : kubectl -n lien-du-coeur-pharma exec deploy/lien-du-coeur-pharma -- cat /data/messages.jsonl
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lien-du-coeur-pharma-data
  namespace: lien-du-coeur-pharma
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lien-du-coeur-pharma
  namespace: lien-du-coeur-pharma
spec:
  replicas: 1
  # L'ancien pod sert tant que le nouveau n'est pas prêt (REGLES §3). Le PVC
  # local-path est RWO : les deux pods sont sur le même nœud, c'est permis.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: lien-du-coeur-pharma
  template:
    metadata:
      labels:
        app: lien-du-coeur-pharma
    spec:
      # Image publique sur GHCR : pas de pull secret (le secret du parc reçoit un 403 sur ce paquet).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: lien-du-coeur-pharma
          ports:
            - containerPort: 8080
          env:
            - name: CONTACT_TO
              value: lienducoeurpharma@gmail.com
            - name: CONTACT_FROM
              value: "Site Lien du Cœur Pharma <formulaire@kladriva.com>"
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lien-du-coeur-pharma-mail
                  key: RESEND_API_KEY
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {memory: 48Mi, cpu: 10m}
            limits: {memory: 128Mi, cpu: 250m}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lien-du-coeur-pharma-data
