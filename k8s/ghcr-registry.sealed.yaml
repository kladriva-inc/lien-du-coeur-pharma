# Pull secret GHCR (paquet privé) — SealedSecret en portée cluster-wide, scellé une fois sur la VM
# avec le certificat public du contrôleur Sealed Secrets (kube-system). Source : whatsapp-gateway,
# tenants/_shared/ghcr-registry.sealed.yaml, namespace substitué. Le contrôleur le déchiffre en
# Secret ghcr-registry dans ce namespace : plus rien à copier à la main. À refaire si le PAT change.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: ghcr-registry
  namespace: lien-du-coeur-pharma
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: ghcr-registry
      namespace: lien-du-coeur-pharma
    type: kubernetes.io/dockerconfigjson
