# Clé API Resend (envoi des courriels du formulaire). SealedSecret portée strict :
# déchiffrable seulement en Secret lien-du-coeur-pharma-mail dans ce namespace.
# Rescellement : docs/DEPLOIEMENT.md.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lien-du-coeur-pharma-mail
  namespace: lien-du-coeur-pharma
spec:
  encryptedData:
    RESEND_API_KEY: 
  template:
    metadata:
      name: lien-du-coeur-pharma-mail
      namespace: lien-du-coeur-pharma
    type: Opaque
